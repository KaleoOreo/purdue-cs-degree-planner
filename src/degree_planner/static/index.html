<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/styles.css">
    <title>Purdue CS Degree Planner</title>
  </head>
  <body>
    <main>
      <h1>Purdue CS Degree Planner</h1>
      <p>Plan courses, track progress, and explore your path to graduation.</p>
      <section>
        <h2>Next Semester</h2>
        <div id="semester-plan" aria-live="polite">
          <p>No semester plan has been generated yet.</p>
        </div>
        <label for="max-credits">Maximum credits</label>
        <input id="max-credits" type="number" min="1" value="15">
        <button id="generate-plan" type="button">Generate Plan</button>
      </section>
    </main>
  </body>
</html>
