[project]
name = "purdue-cs-degree-planner"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143,<0.144",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<2.14",
    "pytest>=9,<10",
]

[project.scripts]
degree-planner = "degree_planner.cli:cli_entry"

[tool.pytest.ini_options]
pythonpath = ["src"]
